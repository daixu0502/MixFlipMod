name: Build and publish release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mixflipmod-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and complete tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test publishing rules
        run: python3 -B -m unittest discover -s .github/scripts/tests -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Java 17 compatible; supports SDK 37.0 package names.
          cmdline-tools-version: '15641748'
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read resolved app version and SDK requirements
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:writeReleaseMetadata

      - name: Select release channel and previous version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release.py prepare

      - name: Install required Android packages
        if: steps.plan.outputs.publish == 'true'
        env:
          SDK_PLATFORM_PACKAGE: ${{ steps.plan.outputs.sdk_platform_package }}
          BUILD_TOOLS: ${{ steps.plan.outputs.build_tools }}
        run: sdkmanager "$SDK_PLATFORM_PACKAGE" "build-tools;$BUILD_TOOLS"

      - name: Check and build signed release
        if: steps.plan.outputs.publish == 'true'
        env:
          MIXFLIPMOD_KEYSTORE_BASE64: ${{ secrets.KEY_STORE }}
          ORG_GRADLE_PROJECT_androidStoreFile: ${{ runner.temp }}/mixflipmod-release.jks
          ORG_GRADLE_PROJECT_androidStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_androidKeyAlias: ${{ secrets.ALIAS }}
          ORG_GRADLE_PROJECT_androidKeyPassword: ${{ secrets.KEY_PASSWORD || secrets.KEY_STORE_PASSWORD }}
        run: |
          python3 -B .github/scripts/release.py signing
          unset MIXFLIPMOD_KEYSTORE_BASE64
          ./gradlew --no-daemon --no-configuration-cache :app:lintRelease :app:assembleRelease

      - name: Verify APK and prepare release files
        if: steps.plan.outputs.publish == 'true'
        env:
          BUILD_TOOLS: ${{ steps.plan.outputs.build_tools }}
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          done
          python3 -B .github/scripts/release.py package

      - name: Save build artifacts
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MixFlipMod-${{ steps.plan.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/github-release/dist/*
            build/github-release/notes.md

      - name: Upload assets and publish
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release.py publish

      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/mixflipmod-release.jks"
